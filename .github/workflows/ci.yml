name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Firmware build and checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Install markdownlint
        run: npm install --global markdownlint-cli2@0.22.1

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .pio
          pio run 2>&1 | tee .pio/firmware-build.log

      - name: Firmware resource budget
        run: python scripts/check_firmware_size.py --report .pio/firmware-build.log

      - name: Host policy tests
        run: sh scripts/quality.sh --host-tests

      - name: Web reproducibility and dependency audit
        run: sh scripts/quality.sh --web

      - name: C static analysis
        run: sh scripts/quality.sh --cppcheck

      - name: Documentation lint
        run: sh scripts/quality.sh --markdown
